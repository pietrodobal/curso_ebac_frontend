<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validador de Números</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f2f5;
            margin: 0;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            text-align: center;
        }
        h1 {
            color: #333;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        input {
            padding: 0.8rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
        }
        button {
            padding: 0.8rem;
            border: none;
            border-radius: 4px;
            background-color: #007bff;
            color: white;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #0056b3;
        }
        .mensagem {
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 4px;
            font-weight: bold;
            display: none; /* A mensagem começa escondida */
        }
        .sucesso {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block; /* Torna visível */
        }
        .erro {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block; /* Torna visível */
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Validador de Números</h1>
        <form id="meuFormulario">
            <input type="number" id="campoA" placeholder="Campo A" required>
            <input type="number" id="campoB" placeholder="Campo B" required>
            
            <button type="submit">Validar</button>
        </form>
        <div id="mensagem-resultado" class="mensagem"></div>
    </div>

    <script>
        // Adiciona um "ouvinte" para o evento de submissão do formulário
        document.getElementById('meuFormulario').addEventListener('submit', function(event) {
            // Previne o comportamento padrão do formulário (que é recarregar a página)
            event.preventDefault();

            // Pega os valores dos campos e converte para números de ponto flutuante
            const campoA = parseFloat(document.getElementById('campoA').value);
            const campoB = parseFloat(document.getElementById('campoB').value);
            const containerMensagem = document.getElementById('mensagem-resultado');

            // 3) Validação: verifica se o número B é maior que o número A
            if (campoB > campoA) {
                // 4) Exibe mensagem positiva
                containerMensagem.innerHTML = "Formulário válido! O número B é maior que o número A.";
                containerMensagem.className = 'mensagem sucesso'; // Adiciona classes para estilo de sucesso
            } else {
                // 4) Exibe mensagem negativa
                containerMensagem.innerHTML = "Formulário inválido! O número B deve ser maior que o número A.";
                containerMensagem.className = 'mensagem erro'; // Adiciona classes para estilo de erro
            }
        });
    </script>

</body>
</html>
